spring:
  config:
    # Load this file only when the dev profile is explicitly active.
    activate:
      on-profile: dev

logging:
  level:
    # Give application code detailed logs while developing locally.
    com.nexora: DEBUG
    # Keep Spring MVC logs at a normal informational level.
    org.springframework.web: INFO

springdoc:
  # Dev only: serves /v3/api-docs (JSON) and /swagger-ui.html (interactive page).
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      # Useful for local diagnosis; avoid exposing details in production.
      show-details: always
